name: Deploy to Vercel

on:
  push:
    branches:
      - develop

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke check deployment
        id: smoke
        run: |
          DEPLOYMENT_URL="${{ steps.deploy.outputs.deployment_url }}"

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Deployment URL is empty."
            exit 1
          fi

          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --max-time 20 "$DEPLOYMENT_URL/" > /dev/null; then
              echo "Smoke check passed."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Smoke check failed. Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Smoke check failed after 3 attempts."
          exit 1

      - name: Rollback on smoke check failure
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        run: |
          vercel rollback --token="$VERCEL_TOKEN"
          vercel rollback status --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
